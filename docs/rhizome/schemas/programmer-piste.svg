<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 572" role="img" aria-label="Programmer une piste en trois questions : quand joue-t-elle, quelle note, quels ornements ; puis ce qui agit sur tout le Monde" font-family="var(--sans,system-ui,sans-serif)" font-size="12"><title>Programmer une piste : trois questions</title><text x="16" y="22" fill="var(--ink,#7d82a8)" font-size="13" font-weight="600" text-anchor="start">Programmer une piste : trois questions</text><text x="16" y="52" fill="var(--mark,#ffc668)" font-size="12" font-weight="600" text-anchor="start">1 · QUAND JOUE-T-ELLE ?</text><rect x="16" y="62" width="246" height="110" rx="6" fill="none" stroke="var(--v4,#80aaff)" stroke-width="1.4"/><text x="26" y="81" fill="var(--v4,#80aaff)" font-size="11.5" font-weight="600" text-anchor="start">EN ORBITE  (GATES ≥ 1)</text><text x="26" y="99" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">SEQ 1 fois, ORBIT :</text><text x="26" y="114" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">PERIOD, la durée du tour</text><text x="26" y="129" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">GATES, les portes (les notes)</text><text x="26" y="144" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">ECCENTRICITY, le rubato ; PHASE</text><rect x="278" y="62" width="246" height="110" rx="6" fill="none" stroke="var(--v1,#ff8c76)" stroke-width="1.4"/><text x="288" y="81" fill="var(--v1,#ff8c76)" font-size="11.5" font-weight="600" text-anchor="start">EN RYTHME  (GATES = 0)</text><text x="288" y="99" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">SEQ 5 fois, RHYTHM :</text><text x="288" y="114" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">HITS, LENGTH, ROTATION, CHANCE</text><text x="288" y="129" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">SEQ 6 fois, GROOVE :</text><text x="288" y="144" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">REPEATS, ACCENT, CLOCK DIV</text><text x="270" y="190" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="middle">une seule à la fois : tant qu&#x27;il y a des portes, l&#x27;orbite joue</text><text x="16" y="222" fill="var(--mark,#ffc668)" font-size="12" font-weight="600" text-anchor="start">2 · QUELLE NOTE ?</text><rect x="16" y="232" width="246" height="126" rx="6" fill="none" stroke="var(--v4,#80aaff)" stroke-width="1.4"/><text x="26" y="251" fill="var(--v4,#80aaff)" font-size="11.5" font-weight="600" text-anchor="start">UN CORPS : K3 PITCH (SEQ 2 fois)</text><text x="26" y="269" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">ORBIT : plus près de l&#x27;étoile,</text><text x="26" y="284" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">plus aigu</text><text x="26" y="299" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">MOTIF : la phrase jouée au clavier</text><text x="26" y="314" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">sur GENERATOR, porte après porte</text><text x="26" y="329" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">ECHO : la note de la piste d&#x27;avant</text><rect x="278" y="232" width="246" height="126" rx="6" fill="none" stroke="var(--v1,#ff8c76)" stroke-width="1.4"/><text x="288" y="251" fill="var(--v1,#ff8c76)" font-size="11.5" font-weight="600" text-anchor="start">UN RYTHME : AU CHOIX</text><text x="288" y="269" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">la note de base (EDIT 4 fois, K2)</text><text x="288" y="284" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">une PHRASE écrite (SEQ 7 et 8 fois),</text><text x="288" y="299" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">en EUCLID ou STEP</text><text x="288" y="314" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">ou un GENERATOR (SEQ 9 fois) :</text><text x="288" y="329" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">RANDOM, MARKOV, MOTIF</text><text x="270" y="376" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="middle">puis, pour toutes : MOTION et le générateur l&#x27;écartent ; la gamme la range (GLO 1 fois)</text><text x="16" y="408" fill="var(--mark,#ffc668)" font-size="12" font-weight="600" text-anchor="start">3 · QUELS ORNEMENTS ?</text><rect x="16" y="418" width="160" height="58" rx="6" fill="none" stroke="var(--v4,#80aaff)" stroke-width="1.4"/><text x="26" y="437" fill="var(--v4,#80aaff)" font-size="11.5" font-weight="600" text-anchor="start">LUNES (SEQ 3 fois)</text><text x="26" y="455" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">des notes après la note</text><rect x="190" y="418" width="160" height="58" rx="6" fill="none" stroke="var(--v1,#ff8c76)" stroke-width="1.4"/><text x="200" y="437" fill="var(--v1,#ff8c76)" font-size="11.5" font-weight="600" text-anchor="start">REPEATS (GROOVE)</text><text x="200" y="455" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">un coup répété 1 à 4 fois</text><rect x="364" y="418" width="160" height="58" rx="6" fill="none" stroke="var(--v3,#7cdeb8)" stroke-width="1.4"/><text x="374" y="437" fill="var(--v3,#7cdeb8)" font-size="11.5" font-weight="600" text-anchor="start">GAMAKA (GLO 2 fois)</text><text x="374" y="455" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">un glissé, une oscillation</text><rect x="16" y="494" width="508" height="64" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55" stroke-dasharray="4 3"/><text x="26" y="513" fill="var(--ink,#7d82a8)" font-size="11.5" font-weight="600" text-anchor="start">SUR TOUT LE MONDE</text><text x="26" y="532" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">tempo, gamme, swing · DENSITY et MOTION (HOME) · FORM (SEQ 10 fois)</text><text x="26" y="547" fill="var(--muted,#9aa2c4)" font-size="11" font-weight="400" text-anchor="start">la comète · ARP : la même variation se rejoue</text></svg>