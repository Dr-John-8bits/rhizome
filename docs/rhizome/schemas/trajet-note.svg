<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 640" role="img" aria-label="Le trajet d'une note dans le séquenceur orbital, de l'horloge à la sortie, avec ce qui agit à chaque étape" font-family="var(--sans,system-ui,sans-serif)" font-size="13"><title>Le trajet d'une note dans le séquenceur orbital</title><text x="16" y="22" fill="var(--ink,#7d82a8)" font-size="13" font-weight="600">Le trajet d'une note</text><text x="524" y="22" fill="var(--muted,#9aa2c4)" font-size="11" text-anchor="end">ce qui agit en chemin</text><rect x="16" y="40" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="64" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">1 · L&#x27;HORLOGE FAIT AVANCER LE CORPS</text><text x="28" y="83" fill="var(--muted,#9aa2c4)" font-size="11">tempo, swing, horloge MIDI reçue</text><line x1="147.0" y1="98" x2="147.0" y2="118" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 115 L147.0 123 L152.0 115 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="69.0" x2="294" y2="69.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="57.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--mark,#ffc668)" font-weight="600">ECCENTRICITY</tspan> : plus vite près de l&#x27;étoile,</text><text x="300" y="73.0" font-size="11" fill="var(--muted,#9aa2c4)">plus lent loin d&#x27;elle (le rubato)</text><text x="300" y="89.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--mark,#ffc668)" font-weight="600">PRECESSION</tspan> : l&#x27;ellipse tourne</text><rect x="16" y="124" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="148" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">2 · LE CORPS FRANCHIT UNE PORTE ?</text><text x="28" y="167" fill="var(--muted,#9aa2c4)" font-size="11">GATES, PHASE, DENSITY</text><line x1="147.0" y1="182" x2="147.0" y2="202" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 199 L147.0 207 L152.0 199 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="153.0" x2="294" y2="153.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="141.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v1,#ff8c76)" font-weight="600">PERTURBATION</tspan> : une porte refusée</text><text x="300" y="157.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v1,#ff8c76)" font-weight="600">FORM</tspan> : la piste se repose</text><text x="300" y="173.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v5,#cc96ff)" font-weight="600">COMÈTE VAGABONDE</tspan> : note sautée ou avancée</text><rect x="16" y="208" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="232" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">3 · QUELLE NOTE ?</text><text x="28" y="251" fill="var(--muted,#9aa2c4)" font-size="11">ORBIT (distance à l&#x27;étoile), MOTIF, ECHO</text><line x1="147.0" y1="266" x2="147.0" y2="286" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 283 L147.0 291 L152.0 283 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="237.0" x2="294" y2="237.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="225.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v3,#7cdeb8)" font-weight="600">GENERATOR, MOTION</tspan> : la note s&#x27;écarte,</text><text x="300" y="241.0" font-size="11" fill="var(--muted,#9aa2c4)">avec sa mémoire (déjà-vu)</text><text x="300" y="257.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v5,#cc96ff)" font-weight="600">COMÈTE VAGABONDE</tspan> : un ou deux degrés</text><rect x="16" y="292" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="316" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">4 · RAMENÉE DANS LA GAMME</text><text x="28" y="335" fill="var(--muted,#9aa2c4)" font-size="11">HARMONY ; VADI et SAMVADI l&#x27;attirent</text><line x1="147.0" y1="350" x2="147.0" y2="370" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 367 L147.0 375 L152.0 367 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="321.0" x2="294" y2="321.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="317.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--mark,#ffc668)" font-weight="600">CONJONCTION</tspan> : deux corps alignés</text><text x="300" y="333.0" font-size="11" fill="var(--muted,#9aa2c4)">avec l&#x27;étoile : accent ou accord</text><rect x="16" y="376" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="400" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">5 · LA VOIX JOUE</text><text x="28" y="419" fill="var(--muted,#9aa2c4)" font-size="11">moteur, GAMAKA, filtre, enveloppe</text><line x1="147.0" y1="434" x2="147.0" y2="454" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 451 L147.0 459 L152.0 451 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="405.0" x2="294" y2="405.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="401.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v4,#80aaff)" font-weight="600">LUNES</tspan> : ornements après la note</text><text x="300" y="417.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v3,#7cdeb8)" font-weight="600">LFO, TIDES</tspan> : le son bouge seul</text><rect x="16" y="460" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="484" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">6 · VERS LES EFFETS</text><text x="28" y="503" fill="var(--muted,#9aa2c4)" font-size="11">envois : bande, HALL, grains</text><line x1="147.0" y1="518" x2="147.0" y2="538" stroke="var(--mark,#ffc668)" stroke-width="2"/><path d="M142.0 535 L147.0 543 L152.0 535 Z" fill="var(--mark,#ffc668)"/><line x1="278" y1="489.0" x2="294" y2="489.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="477.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v5,#cc96ff)" font-weight="600">COMÈTE</tspan> SWELL : la HALL gonfle ;</text><text x="300" y="493.0" font-size="11" fill="var(--muted,#9aa2c4)">FREEZE : les grains se figent</text><text x="300" y="509.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v5,#cc96ff)" font-weight="600">VAGABONDE</tspan> : la bande trébuche</text><rect x="16" y="544" width="262" height="58" rx="6" fill="none" stroke="var(--ink,#7d82a8)" stroke-opacity=".55"/><text x="28" y="568" fill="var(--ink,#7d82a8)" font-size="12" font-weight="600">7 · LA SORTIE</text><text x="28" y="587" fill="var(--muted,#9aa2c4)" font-size="11">mélange, chorus, MASTER</text><line x1="278" y1="573.0" x2="294" y2="573.0" stroke="var(--muted,#9aa2c4)" stroke-dasharray="3 3"/><text x="300" y="569.0" font-size="11" fill="var(--muted,#9aa2c4)"><tspan fill="var(--v5,#cc96ff)" font-weight="600">COMÈTE</tspan> FILTER : fermé loin de l&#x27;étoile,</text><text x="300" y="585.0" font-size="11" fill="var(--muted,#9aa2c4)">grand ouvert quand elle la frôle</text></svg>