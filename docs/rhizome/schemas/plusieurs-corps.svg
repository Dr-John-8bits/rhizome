<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" role="img" aria-label="Deux corps de périodes 3 et 4 mesures : leurs notes ne tombent ensemble que toutes les 12 mesures" font-family="var(--sans,system-ui,sans-serif)" font-size="13"><title>Deux corps de périodes 3 et 4 mesures : leurs notes ne tombent ensemble que toutes les 12 mesures</title><circle cx="120" cy="140" r="60.0" fill="none" stroke="var(--v2,#d9a23a)" stroke-opacity=".6" stroke-width="1.5"/><line x1="120" y1="72.0" x2="120" y2="88.0" stroke="var(--v2,#d9a23a)" stroke-width="3" stroke-linecap="round"/><circle cx="179.1" cy="129.8" r="6" fill="var(--v2,#d9a23a)"/><circle cx="120" cy="140" r="72.7" fill="none" stroke="var(--v3,#3fb98f)" stroke-opacity=".6" stroke-width="1.5"/><line x1="120" y1="59.3" x2="120" y2="75.3" stroke="var(--v3,#3fb98f)" stroke-width="3" stroke-linecap="round"/><circle cx="176.9" cy="94.8" r="6" fill="var(--v3,#3fb98f)"/><circle cx="120" cy="140" r="5" fill="var(--mark,#ffc668)"/><circle cx="120" cy="140" r="9" fill="none" stroke="var(--mark,#ffc668)" stroke-opacity=".5"/><text x="120.0" y="240.0" fill="var(--muted,#9aa2c4)" text-anchor="middle" font-size="11" font-weight="400">deux corps, une porte chacun, en haut</text><text x="250.0" y="24.0" fill="var(--ink,#7d82a8)" text-anchor="start" font-size="13" font-weight="600">Un tour de 3 mesures et un tour de 4</text><text x="266.0" y="68.0" fill="var(--v2,#d9a23a)" text-anchor="start" font-size="12" font-weight="600">3 mesures</text><line x1="250" y1="80" x2="514" y2="80" stroke="var(--rule,#9aa2c4)"/><circle cx="250" cy="80" r="6" fill="var(--v2,#d9a23a)"/><circle cx="316" cy="80" r="6" fill="var(--v2,#d9a23a)"/><circle cx="382" cy="80" r="6" fill="var(--v2,#d9a23a)"/><circle cx="448" cy="80" r="6" fill="var(--v2,#d9a23a)"/><circle cx="514" cy="80" r="6" fill="var(--v2,#d9a23a)"/><text x="266.0" y="112.0" fill="var(--v3,#3fb98f)" text-anchor="start" font-size="12" font-weight="600">4 mesures</text><line x1="250" y1="124" x2="514" y2="124" stroke="var(--rule,#9aa2c4)"/><circle cx="250" cy="124" r="6" fill="var(--v3,#3fb98f)"/><circle cx="338" cy="124" r="6" fill="var(--v3,#3fb98f)"/><circle cx="426" cy="124" r="6" fill="var(--v3,#3fb98f)"/><circle cx="514" cy="124" r="6" fill="var(--v3,#3fb98f)"/><line x1="250" y1="156" x2="250" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="272" y1="156" x2="272" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="294" y1="156" x2="294" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="316" y1="156" x2="316" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="338" y1="156" x2="338" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="360" y1="156" x2="360" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="382" y1="156" x2="382" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="404" y1="156" x2="404" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="426" y1="156" x2="426" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="448" y1="156" x2="448" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="470" y1="156" x2="470" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="492" y1="156" x2="492" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="514" y1="156" x2="514" y2="164" stroke="var(--rule,#9aa2c4)"/><line x1="250" y1="160" x2="514" y2="160" stroke="var(--rule,#9aa2c4)"/><text x="250.0" y="180.0" fill="var(--muted,#9aa2c4)" text-anchor="middle" font-size="11" font-weight="400">0</text><text x="525.0" y="180.0" fill="var(--muted,#9aa2c4)" text-anchor="end" font-size="11" font-weight="400">12 mesures</text><rect x="239" y="66" width="22" height="100" rx="6" fill="none" stroke="var(--mark,#ffc668)" stroke-dasharray="3 3"/><rect x="503" y="66" width="22" height="100" rx="6" fill="none" stroke="var(--mark,#ffc668)" stroke-dasharray="3 3"/><text x="239.0" y="210.0" fill="var(--ink,#7d82a8)" text-anchor="start" font-size="12" font-weight="400">Ils ne jouent ensemble que toutes</text><text x="239.0" y="227.0" fill="var(--ink,#7d82a8)" text-anchor="start" font-size="12" font-weight="400">les 12 mesures (3 × 4) : c’est la</text><text x="239.0" y="244.0" fill="var(--ink,#7d82a8)" text-anchor="start" font-size="12" font-weight="400">polyrythmie. Alignés avec l’étoile,</text><text x="239.0" y="261.0" fill="var(--ink,#7d82a8)" text-anchor="start" font-size="12" font-weight="400">ils sont en conjonction.</text></svg>
