<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-label="Les pistes entre elles : écho, conjonction, polyrythmie, comète vagabonde, ducking, forme, et ce qu'elles partagent" font-family="var(--sans,system-ui,sans-serif)" font-size="12"><title>Les pistes entre elles</title><text x="16.0" y="22.0" fill="var(--ink,#7d82a8)" font-size="13" font-weight="600" text-anchor="start">Les pistes entre elles</text><circle cx="150" cy="192" r="44" fill="none" stroke="var(--v1,#ff8c76)" stroke-opacity=".55" stroke-width="1.3"/><circle cx="150" cy="192" r="74" fill="none" stroke="var(--v2,#ffc668)" stroke-opacity=".55" stroke-width="1.3"/><circle cx="150" cy="192" r="104" fill="none" stroke="var(--v3,#7cdeb8)" stroke-opacity=".55" stroke-width="1.3"/><circle cx="150" cy="192" r="132" fill="none" stroke="var(--v4,#80aaff)" stroke-opacity=".55" stroke-width="1.3"/><circle cx="172.0" cy="153.9" r="6" fill="var(--v1,#ff8c76)"/><circle cx="221.5" cy="211.2" r="6" fill="var(--v2,#ffc668)"/><circle cx="49.5" cy="165.1" r="6" fill="var(--v3,#7cdeb8)"/><circle cx="251.1" cy="276.8" r="6" fill="var(--v4,#80aaff)"/><circle cx="150" cy="192" r="6" fill="var(--mark,#ffc668)"/><circle cx="150" cy="192" r="10" fill="none" stroke="var(--mark,#ffc668)" stroke-opacity=".5"/><line x1="150" y1="192" x2="220.0" y2="70.8" stroke="var(--ink,#7d82a8)" stroke-width="1.2"/><circle cx="202.0" cy="101.9" r="5" fill="none" stroke="var(--v3,#7cdeb8)" stroke-width="1.5"/><text x="225.0" y="74.8" fill="var(--ink,#7d82a8)" font-size="13" font-weight="600" text-anchor="start">②</text><line x1="221.5" y1="211.2" x2="49.5" y2="165.1" stroke="var(--v3,#7cdeb8)" stroke-dasharray="3 3" stroke-width="1.4"/><text x="131.5" y="180.1" fill="var(--v3,#7cdeb8)" font-size="13" font-weight="600" text-anchor="start">①</text><text x="146.0" y="252.0" fill="var(--muted,#9aa2c4)" font-size="13" font-weight="600" text-anchor="start">③</text><circle cx="251.1" cy="276.8" r="11" fill="none" stroke="var(--v5,#cc96ff)" stroke-dasharray="2 2"/><circle cx="281.1" cy="316.8" r="4" fill="var(--v5,#cc96ff)"/><line x1="284.1" y1="319.8" x2="307.1" y2="334.8" stroke="var(--v5,#cc96ff)" stroke-width="2" stroke-linecap="round"/><path d="M243.1 268.8 Q 251.5 221.2 230.5 216.2" fill="none" stroke="var(--v5,#cc96ff)" stroke-dasharray="2 3"/><text x="291.1" y="312.8" fill="var(--v5,#cc96ff)" font-size="13" font-weight="600" text-anchor="start">④</text><text x="318.0" y="50.0" fill="var(--v3,#7cdeb8)" font-size="11.5" font-weight="600" text-anchor="start">① ÉCHO</text><text x="318.0" y="65.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">la piste reprend la dernière note de la</text><text x="318.0" y="79.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">piste d&#x27;avant, sur l&#x27;accord (SEQ 2 fois, K3)</text><text x="318.0" y="101.0" fill="var(--ink,#7d82a8)" font-size="11.5" font-weight="600" text-anchor="start">② CONJONCTION</text><text x="318.0" y="116.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">deux corps alignés avec l&#x27;étoile : un accent</text><text x="318.0" y="130.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">ou un accord (SEQ 4 fois, K4)</text><text x="318.0" y="152.0" fill="var(--muted,#9aa2c4)" font-size="11.5" font-weight="600" text-anchor="start">③ POLYRYTHMIE</text><text x="318.0" y="167.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">des périodes en rapports simples (2:3:4)</text><text x="318.0" y="181.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">se retrouvent ; libres, jamais</text><text x="318.0" y="203.0" fill="var(--v5,#cc96ff)" font-size="11.5" font-weight="600" text-anchor="start">④ COMÈTE VAGABONDE</text><text x="318.0" y="218.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">un choc sur le corps le plus proche,</text><text x="318.0" y="232.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">qui peut passer au voisin</text><text x="318.0" y="254.0" fill="var(--v1,#ff8c76)" font-size="11.5" font-weight="600" text-anchor="start">⑤ DUCKING</text><text x="318.0" y="269.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">une piste fait baisser les autres</text><text x="318.0" y="283.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">à chaque note (FX 7 fois)</text><text x="318.0" y="305.0" fill="var(--v2,#ffc668)" font-size="11.5" font-weight="600" text-anchor="start">⑥ FORM</text><text x="318.0" y="320.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">des pistes se reposent dans le calme,</text><text x="318.0" y="334.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">reviennent au sommet (SEQ 10 fois)</text><text x="16.0" y="368.0" fill="var(--muted,#9aa2c4)" font-size="10.5" font-weight="400" text-anchor="start">Toutes partagent le tempo, la gamme, les macros DENSITY et MOTION, et les effets (bande, HALL, grains).</text></svg>