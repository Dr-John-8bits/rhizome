name = "Rhizome"
id_prefix = "FM-1_968"
usb_manufacturer = "Rhizome Project"
usb_product = "Rhizome FM-1"
ble = false
backup = true
usb_audio_in = true
usb_audio_out = false
words = "words.tsv"
font_set = "dreams"
o2 = ["dsp/dreams.cpp", "dsp/chorus.cpp", "third_party/plaits/resources.cc", "third_party/rings/resources.cc", "third_party/stmlib/dsp/units.cc", "third_party/stmlib/utils/random.cc", "third_party/plaits/dsp/engine2/string_machine_engine.cc", "third_party/plaits/dsp/engine/wavetable_engine.cc", "third_party/plaits/dsp/engine2/wave_terrain_engine.cc", "third_party/plaits/dsp/engine2/six_op_engine.cc", "third_party/plaits/dsp/engine/swarm_engine.cc", "third_party/plaits/dsp/engine2/phase_distortion_engine.cc", "third_party/plaits/dsp/engine/chord_engine.cc", "third_party/plaits/dsp/engine/grain_engine.cc", "third_party/plaits/dsp/chords/chord_bank.cc", "third_party/plaits/dsp/fm/algorithms.cc", "third_party/plaits/dsp/fm/dx_units.cc"]
include = ["third_party"]
vendored = ["third_party/"]
# Optimize DSP loops without fast-math or changed floating-point contraction.
o2_cflags = ["-O3", "-DTEST", "-ffunction-sections", "-fdata-sections"]
licence = "GPL-3.0-only combined distribution; original MIT/MPL-2.0 notices retained"

device_include = ["compat"]
